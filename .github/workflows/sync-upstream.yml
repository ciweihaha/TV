name: Sync upstream

# 上游同步说明：
# - 本仓库是 FongMi/TV 的 fork，默认分支 fongmi，上面有用户自己的改动
#   （第 138-141 轮等本地提交，2026-11-12 核对：比上游多 58 个提交，
#   上游没有本仓库没有的提交），所以同步不是快进，而是把上游合并进来。
# - 触发：每天定时 + 手动 dispatch。合并用 --no-ff，产生一个合并提交，
#   与之前人工 PR #2 的做法一致；已经是最新时 git 会直接报
#   Already up to date，不产生空提交。
# - 冲突时工作流直接失败报错，不自动解决、不强推，等人工处理。
# - 同步推上去后，Build Android APK 工作流会自动跑，验证新代码能构建。
# - 上游地址写死为 https://github.com/FongMi/TV.git（公开仓库，只读拉取）。

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 代码迁出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 合并上游
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/FongMi/TV.git
          git fetch upstream fongmi
          git checkout fongmi
          git merge --no-ff upstream/fongmi -m "chore: 同步上游 FongMi/TV"
          git push origin fongmi
