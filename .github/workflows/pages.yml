name: Publish website to GitHub Pages

on:
  push:
    branches: [fongmi]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@v6.0.0
        id: pages
        with:
          # Forks don't have Pages enabled; let the action enable it.
          enablement: true
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
