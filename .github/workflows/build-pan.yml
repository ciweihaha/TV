name: Build Pan TV (leanback)
on:
  push:
    branches: [pan-private]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- available android-37 packages ---"
          sdkmanager --list 2>/dev/null | grep -i "android-37" || true
          sdkmanager "platform-tools" || true
          sdkmanager "build-tools;37.0.0" || true
          sdkmanager "cmake;3.22.1" || true
          sdkmanager "ndk;28.2.13676358" || true
          sdkmanager "platforms;android-37" || sdkmanager --channel=3 "platforms;android-37" || true
          echo "--- platforms after install ---"
          ls "$ANDROID_HOME/platforms" || true
      - name: Restore signing keystore from cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: app/pan.jks
          key: pan-keystore-v1
      - name: Generate signing keystore if missing
        run: |
          if [ ! -f app/pan.jks ]; then
            keytool -genkeypair -keystore app/pan.jks -alias pan -keyalg RSA -keysize 2048 -validity 10000 -storepass pan123456 -keypass pan123456 -dname "CN=Pan, OU=Personal, O=Personal, C=CN"
          fi
          printf 'storeFile=%s\nkeyAlias=pan\nstorePassword=pan123456\n' "$GITHUB_WORKSPACE/app/pan.jks" > local.properties
      - name: make gradlew executable
        run: chmod +x ./gradlew
              - name: Build leanback release APK
        run: ./gradlew :app:assembleLeanbackRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pan-tv-leanback
          path: app/build/outputs/apk/leanback/release/*.apk
          if-no-files-found: error
