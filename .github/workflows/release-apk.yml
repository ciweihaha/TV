name: Upload APK to Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (must already exist)"
        required: true
        default: "v5.9.1"
      run_id:
        description: "Build Android APK run id whose tv-debug-apks artifact to use"
        required: true
        default: "43419212365"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repo (gh CLI needs a git context)
        uses: actions/checkout@v4
        with:
          ref: fongmi

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: tv-debug-apks
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload leanback arm64 APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la leanback/debug/
          APK="leanback/debug/app-leanback-arm64-v8a-debug.apk"
          test -f "$APK"
          TAG="${{ inputs.tag }}"
          NAME="TV-${TAG#v}-leanback-arm64-v8a.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME"
          gh release upload "${{ inputs.tag }}" "$NAME" --clobber --repo ciweihaha/TV
          gh release view "${{ inputs.tag }}" --json assets --jq '.assets[] | "\(.name) \(.size)"' --repo ciweihaha/TV
