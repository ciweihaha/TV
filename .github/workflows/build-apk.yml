name: Build Android APK

on:
  push:
    branches: [fongmi]
    paths:
      - "app/**"
      - "catvod/**"
      - "nodejs/**"
      - "quickjs/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # gradle-daemon-jvm.properties pins toolchainVendor=JETBRAINS, version 21
      - name: Set up JetBrains JDK 21
        uses: actions/setup-java@v6.2.0
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: |
          # API 37 is Android 17 (Cinnamon Bun) preview, package id is
          # "platforms;android-37.0" (minor-version id) and it is distributed
          # through the beta channel (channel 1 = stable + beta).
          yes | sdkmanager --licenses
          sdkmanager --channel=1 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "ndk;29.0.14206865" "cmake;4.1.2"

      # app/build.gradle reads local.properties at configuration time and both
      # debug and release build types use the release signing config, so a
      # signing config must exist before Gradle configures. Use a throwaway
      # debug keystore; local.properties is gitignored (*.properties).
      - name: Create temporary signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=US"
          cat > local.properties <<EOF
          storeFile=$RUNNER_TEMP/debug.keystore
          keyAlias=androiddebugkey
          storePassword=android
          EOF

      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-home-cache-cleanup: true
      # gradlew is stored without the executable bit in this repo (mode 100644),
      # so set it here instead of relying on the checkout mode.
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tv-debug-apks
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
          retention-days: 7
